{% extends 'base.html' %}

{% block content %}

<section class="cadastro-container">

    <div class="cadastro-card">

        <h1>Crie sua conta</h1>

        <p>Faça seu cadastro para aproveitar nossas delícias!</p>

        <form>

            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">
            </div>

            <div class="form-group">
                <label for="usuario">Nome de usuário</label>
                <input type="text" id="usuario" placeholder="Escolha um nome de usuário">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha">
            </div>

            <div class="form-group">
                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" placeholder="Digite sua senha novamente">
            </div>

            <button type="submit">Criar conta</button>

        </form>

        <p class="login-link">
            Já possui uma conta?
            <a href="{% url 'login' %}">Faça login</a>
        </p>

    </div>

</section>

{% endblock %}
