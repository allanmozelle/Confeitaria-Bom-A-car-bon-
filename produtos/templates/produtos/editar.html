{% extends 'base.html' %}

{% block content %}

<section class="editar-produto">

    <div class="editar-produto-cabecalho">
        <span>ÁREA DO FUNCIONÁRIO</span>
        <h1>Editar produto</h1>
        <p>Atualize as informações de um produto do cardápio.</p>
    </div>

    <div class="editar-produto-card">

        <form>

            <div class="form-group">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" value="Bolo de Chocolate">
            </div>

            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria">
                    <option value="bolos" selected>Bolos</option>
                    <option value="docinhos">Docinhos</option>
                    <option value="especiais">Especiais</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" rows="4">Um delicioso bolo de chocolate, preparado com ingredientes selecionados.</textarea>
            </div>

            <div class="form-group">
                <label for="preco">Preço</label>
                <input type="number" id="preco" value="45.00" step="0.01">
            </div>

            <div class="form-group">
                <label for="imagem">Alterar imagem</label>
                <input type="file" id="imagem" accept="image/*">
            </div>

            <button type="submit" class="salvar-produto">
                Salvar alterações
            </button>

        </form>

    </div>

</section>

{% endblock %}
