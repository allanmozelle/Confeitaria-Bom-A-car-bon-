{% extends 'base.html' %}

{% block content %}

<section class="cadastro-produto">

    <div class="cadastro-produto-cabecalho">
        <span>ÁREA DO FUNCIONÁRIO</span>
        <h1>Cadastrar produto</h1>
        <p>Adicione uma nova delícia ao nosso cardápio.</p>
    </div>

    <div class="cadastro-produto-card">

        <form>

            <div class="form-group">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" placeholder="Ex.: Bolo de Chocolate">
            </div>

            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria">
                    <option value="">Selecione uma categoria</option>
                    <option value="bolos">Bolos</option>
                    <option value="docinhos">Docinhos</option>
                    <option value="especiais">Especiais</option>
                </select>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" rows="4" placeholder="Descreva o produto..."></textarea>
            </div>

            <div class="form-group">
                <label for="preco">Preço</label>
                <input type="number" id="preco" step="0.01" placeholder="Ex.: 45.00">
            </div>

            <div class="form-group">
                <label for="imagem">Imagem do produto</label>
                <input type="file" id="imagem" accept="image/*">
            </div>

            <button type="submit" class="salvar-produto">
                Cadastrar produto
            </button>

        </form>

    </div>

</section>

{% endblock %}
