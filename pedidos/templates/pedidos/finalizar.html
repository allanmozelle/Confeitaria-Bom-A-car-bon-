{% extends 'base.html' %}

{% block content %}

<section class="finalizar-pedido">

    <div class="finalizar-cabecalho">
        <span>QUASE LÁ!</span>
        <h1>Finalizar pedido</h1>
        <p>Confira seus dados e confirme seu pedido.</p>
    </div>

    <div class="finalizar-conteudo">

        <div class="finalizar-formulario">

            <h2>Informações do pedido</h2>

            <form>

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo">
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000">
                </div>

                <div class="form-group">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" placeholder="Rua, número e bairro">
                </div>

                <div class="form-group">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" rows="4" placeholder="Alguma informação adicional?"></textarea>
                </div>

                <button type="submit" class="confirmar-pedido">
                    Confirmar pedido
                </button>

            </form>

        </div>

        <div class="finalizar-resumo">

            <h2>Resumo do pedido</h2>

            <div class="finalizar-produto">
                <span>Bolo de Chocolate × 1</span>
                <strong>R$ 45,00</strong>
            </div>

            <div class="finalizar-produto">
                <span>Cupcake Especial × 2</span>
                <strong>R$ 16,00</strong>
            </div>

            <div class="finalizar-total">
                <span>Total</span>
                <strong>R$ 61,00</strong>
            </div>

            <p class="finalizar-aviso">
                O pagamento será combinado posteriormente.
            </p>

        </div>

    </div>

</section>

{% endblock %}
